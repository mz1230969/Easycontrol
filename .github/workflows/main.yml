name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Missing Code & Build
      run: |
        cd easycontrol
        # 允许编译遇到某些错误时继续强行打包
        chmod +x ./gradlew
        ./gradlew assembleDebug --continue || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EasyControl-Debug
        path: easycontrol/app/build/outputs/apk/debug/*.apk
